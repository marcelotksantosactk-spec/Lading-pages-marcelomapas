(function(){
  var VIDEO_SRC = 'video/VLS%20-%20OK%20.mov';
  function attach(el){
    if(!el || el.dataset.videoDone) return;
    el.dataset.videoDone = '1';
    var video = document.createElement('video');
    video.className = el.className || 'absolute inset-0 block h-full w-full';
    video.setAttribute('controls','');
    video.setAttribute('playsinline','');
    video.setAttribute('preload','metadata');
    video.title = 'Vídeo de apresentação — Combo Policial';
    video.setAttribute('controlsList','nodownload');
    var source = document.createElement('source');
    source.src = VIDEO_SRC;
    video.appendChild(source);
    video.appendChild(document.createTextNode('Seu navegador não suporta a reprodução de vídeo.'));
    if(el.parentNode){ el.parentNode.replaceChild(video, el); }
  }
  function scan(){
    document.querySelectorAll('vslplay-player').forEach(attach);
  }
  scan();
  var mo = new MutationObserver(scan);
  mo.observe(document.body, {childList:true, subtree:true});
})();
</script>
