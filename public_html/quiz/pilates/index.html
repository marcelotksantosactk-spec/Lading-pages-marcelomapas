let idx=0; const hist=[];
const view=document.getElementById('view'),foot=document.getElementById('foot'),next=document.getElementById('next'),back=document.getElementById('back');
const val=v=>typeof v==='function'?v():v;
const visible=s=>!s.when||s.when();
const countable=STEPS.filter(s=>s.type!=='offer').length;
function setProg(){document.getElementById('prog').style.width=Math.min(100,(idx/countable)*100)+'%'}
function setFoot(label,enabled,fn){if(!label){foot.hidden=true;return}foot.hidden=false;next.textContent=label;next.disabled=!enabled;next.onclick=fn}
function go(){track('ViewContent',{content_name:'quiz_step_'+idx});let n=idx+1;while(n<STEPS.length&&!visible(STEPS[n]))n++;hist.push(idx);idx=n;render();window.scrollTo(0,0)}
back.onclick=()=>{if(!hist.length)return;idx=hist.pop();render()};
function bmi(){const h=S.height/100;return S.weight/(h*h)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
 const s=STEPS[idx];
 document.getElementById('toptitle').textContent=s.type==='age'?C.PRODUCT_NAME:(s.sec||C.PRODUCT_NAME);
 back.hidden=idx===0||['loading','offer'].includes(s.type);
 document.getElementById('progwrap').style.visibility=(s.type==='age'||s.type==='offer')?'hidden':'visible';
 setProg(); setFoot(null);
 const R=renderers[s.type]; view.innerHTML='<div class="screen">'+R(s)+'</div>'; (after[s.type]||(()=>{}))(s);
}

 single:s=>{view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S[s.id]=s.o[b.dataset.i][0];view.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
   if(s.tip){document.getElementById('tipbox').innerHTML=tipHtml(s.tip);setFoot('Avançar',true,go)}else setTimeout(go,250)});
   if(s.tip&&S[s.id]){document.getElementById('tipbox').innerHTML=tipHtml(s.tip);setFoot('Avançar',true,go)}},
 grid:s=>view.querySelectorAll('.gcard').forEach(b=>b.onclick=()=>{S[s.id]=s.o[b.dataset.i][0];b.classList.add('sel');setTimeout(go,250)}),
 multi:s=>{const sync=()=>setFoot('Avançar',(S[s.id]||[]).length>0,go);
   view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=s.o[b.dataset.i][0];let a=S[s.id]||[];
     if(a.includes(v))a=a.filter(x=>x!==v);else{ if(s.none&&v===s.none)a=[v];else a=a.filter(x=>x!==s.none).concat(v)}
     S[s.id]=a;view.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',a.includes(s.o[x.dataset.i][0])));sync()});sync()},
 info:s=>setFoot(s.b||'Continuar',true,go),
 good:()=>setFoot('Quero isso!',true,go),
 yesno:s=>view.querySelectorAll('.yn button').forEach(b=>b.onclick=()=>{S[s.id]=b.dataset.v;go()}),
 input:s=>{const i=document.getElementById('num'),c=document.getElementById('cons'),e=document.getElementById('err');
   const ok=()=>{const v=parseFloat(String(i.value).replace(',','.'));const inR=v>=s.min&&v<=s.max;e.textContent=i.value&&!inR?`Digite um valor entre ${s.min} e ${s.max} ${s.unit}`:'';return inR&&(!c||c.checked)};
   const upd=()=>setFoot('Avançar',ok(),()=>{S[s.id]=parseFloat(String(i.value).replace(',','.'));if(c)S.consent=true;go()});
   i.oninput=upd;if(c)c.onchange=upd;upd();setTimeout(()=>i.focus(),200)},
 loading:s=>runRing(s.ms||3000,402),
 social:()=>runRing(4000,289),
 bmi:()=>setFoot('Continuar',true,go),
 swipe:s=>view.querySelectorAll('.swipe-btns button').forEach(b=>b.onclick=()=>{S[s.id]=b.dataset.v;go()}),
 program:()=>setFoot('Continuar',true,go),
 blockers:()=>{setTimeout(()=>view.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'),80);setFoot('Continuar',true,go)},
 email:()=>{const i=document.getElementById('em'),e=document.getElementById('err');const ok=()=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(i.value.trim());
   const upd=()=>setFoot('Ver meu plano',ok(),()=>{S.email=i.value.trim();track('CompleteRegistration',{content_name:'quiz_email'});go()});i.oninput=upd;upd()},
 offer:()=>setFoot('Quero meu plano agora',true,checkout)
};
function runRing(ms,len){const arc=document.getElementById('arc'),pct=document.getElementById('pct');const t0=performance.now();
 (function f(t){const p=Math.min(1,(t-t0)/ms);arc.style.strokeDashoffset=len*(1-p);pct.textContent=Math.round(p*100)+'%';if(p<1)requestAnimationFrame(f);else setTimeout(go,350)})(t0)}
function checkout(){
 track('InitiateCheckout',{content_name:C.PRODUCT_NAME});
 try{const u=new URL(C.CHECKOUT_URL);const q=new URLSearchParams(location.search);q.forEach((v,k)=>{if(!u.searchParams.has(k))u.searchParams.set(k,v)});if(S.email)u.searchParams.set('email',S.email);location.href=u.toString()}
 catch(e){location.href=C.CHECKOUT_URL}
}
render();
</script>
</body>
